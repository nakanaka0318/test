<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>列に並べ！ショッピングバトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* スーパーの特売ポスター: 赤×黄の値札、ミントの床タイル、紺の文字 */
:root{
  --floor:#dff3ec; --floor2:#cdebe0; --ink:#1d2340; --paper:#ffffff;
  --sale:#ff3b3b; --tag:#ffd43b; --mint:#14b8a6; --shade:rgba(29,35,64,.12);
  --c-active:#ff4d6d; --c-passive:#8b5cf6; --c-stat:#10b981; --c-queue:#f59e0b; --c-bag:#e11d48;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--floor);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;
  background-image:linear-gradient(45deg,var(--floor2) 25%,transparent 25%,transparent 75%,var(--floor2) 75%),linear-gradient(45deg,var(--floor2) 25%,transparent 25%,transparent 75%,var(--floor2) 75%);
  background-size:48px 48px;background-position:0 0,24px 24px;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.screen[hidden]{display:none!important}
.btn{font-family:var(--display);font-size:20px;background:var(--sale);color:#fff;padding:14px 22px;border-radius:14px;
  box-shadow:0 5px 0 #b51c1c;letter-spacing:.04em;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b51c1c}
.btn.sub{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 #9aa3c0;font-size:16px}
.btn.sub:active{box-shadow:0 1px 0 #9aa3c0}
.btn:disabled{opacity:.45}
.mute{font-size:20px;width:40px;height:40px;border-radius:50%;background:var(--paper);box-shadow:0 2px 0 var(--shade)}
.emo{font-family:var(--emoji)}

/* ---------- タイトル ---------- */
#scr-title{align-items:center;justify-content:center;gap:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
.poster{background:var(--tag);border:5px solid var(--ink);border-radius:18px;padding:18px 14px 16px;transform:rotate(-2deg);box-shadow:8px 8px 0 var(--ink);width:min(100%,380px)}
.poster .kicker{display:inline-block;background:var(--sale);color:#fff;font-family:var(--display);font-size:14px;padding:3px 10px;border-radius:999px;letter-spacing:.1em}
.poster h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,14vw,64px);line-height:1.05;margin:8px 0 2px;color:var(--sale);
  text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1.5px var(--ink)}
.poster h2{font-family:var(--display);font-weight:400;font-size:clamp(22px,7vw,30px);margin:0;color:var(--ink)}
.poster .price{margin-top:8px;font-size:13px}
.parade{font-family:var(--emoji);font-size:34px;white-space:nowrap;width:100%;overflow:hidden;height:46px;position:relative}
.parade span{position:absolute;left:100%;animation:walk 9s linear infinite}
@keyframes walk{to{left:-60px}}
@keyframes bob{50%{transform:translateY(-4px)}}
.title-btns{display:flex;flex-direction:column;gap:12px;width:min(100%,300px)}
.small-note{font-size:12px;opacity:.7}

/* ---------- キャラ選択 ---------- */
#scr-select{padding:12px max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-right,0px));gap:10px;overflow-y:auto}
.sec-h{font-family:var(--display);font-size:22px;margin:4px 0 0;display:flex;align-items:center;gap:8px}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.char{background:var(--paper);border:3px solid transparent;border-radius:14px;padding:10px;text-align:left;box-shadow:0 3px 0 var(--shade);display:flex;flex-direction:column;gap:4px}
.char.sel{border-color:var(--c);box-shadow:0 0 0 3px var(--c) inset,0 3px 0 var(--shade)}
.char .face{font-family:var(--emoji);font-size:38px;width:54px;height:54px;border-radius:50%;background:var(--c);display:grid;place-items:center;border:3px solid var(--ink)}
.char .nm{font-family:var(--display);font-size:18px}
.char .role{font-size:11px;opacity:.7}
.char .trait{font-size:11px;line-height:1.45}
.bars{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;font-size:10px;align-items:center}
.bars i{display:block;height:6px;border-radius:3px;background:var(--c);min-width:4px}
.diff{display:flex;gap:6px}
.diff button{flex:1;background:var(--paper);border-radius:10px;padding:10px 4px;font-weight:800;box-shadow:0 3px 0 var(--shade)}
.diff button.sel{background:var(--ink);color:#fff}
.select-foot{display:flex;gap:10px;margin-top:auto;padding-top:6px}
.select-foot .btn{flex:1}

/* ---------- 買い物 ---------- */
#scr-shop{background:transparent}
.shop-top{display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-left,0px)) 6px max(12px,env(safe-area-inset-right,0px));background:var(--sale);color:#fff;box-shadow:0 3px 0 #b51c1c}
.clock{font-family:var(--display);font-size:24px;background:#fff;color:var(--ink);border-radius:10px;padding:2px 10px;font-variant-numeric:tabular-nums;min-width:82px;text-align:center}
.clock.hurry{background:var(--tag);animation:bob .5s infinite}
.stitle{flex:1;font-size:12px;line-height:1.1}
.stitle b{display:block;font-family:var(--display);font-size:17px;font-weight:400}
.inv-btn{background:#fff;color:var(--ink);border-radius:10px;padding:6px 10px;font-weight:800;font-size:15px}
#minimap{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:6px 8px;background:var(--ink)}
.mm{background:#2d3560;border-radius:6px;padding:2px 0 3px;color:#fff;font-size:9px;text-align:center;position:relative;line-height:1.15}
.mm .ic{font-family:var(--emoji);font-size:15px;display:block}
.mm.rare{background:#7a5b00;box-shadow:0 0 0 2px var(--tag) inset}
.mm.view{outline:2px solid #fff}
.mm .dots{display:flex;justify-content:center;gap:1px;height:6px;margin-top:1px}
.mm .dots i{width:6px;height:6px;border-radius:50%;background:var(--c);border:1px solid #fff}
.mm.me{background:#fff;color:var(--ink)}
#feed{height:20px;font-size:11px;padding:2px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:rgba(255,255,255,.75)}
#lanes{flex:1;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:10px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#lanes::-webkit-scrollbar{display:none}
.lane{flex:0 0 148px;scroll-snap-align:start;display:flex;flex-direction:column;background:rgba(255,255,255,.55);border-radius:14px;position:relative;overflow:hidden}
.lane.mine{background:rgba(255,255,255,.9);box-shadow:0 0 0 3px var(--ink)}
.card{background:var(--paper);border-radius:14px 14px 0 0;padding:6px 8px 6px;text-align:center;position:relative;border-bottom:4px dashed var(--cc);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:142px}
.card .lno{position:absolute;left:6px;top:5px;font-family:var(--display);font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 5px}
.card .info{position:absolute;right:6px;top:4px;width:22px;height:22px;border-radius:50%;background:var(--floor);font-weight:800;font-size:13px;line-height:22px}
.card .ic{font-family:var(--emoji);font-size:40px;line-height:1.1;margin-top:10px}
.card .nm{font-weight:800;font-size:12px;line-height:1.2;min-height:29px;display:flex;align-items:center}
.card .badge{font-size:10px;color:#fff;background:var(--cc);border-radius:999px;padding:1px 8px;font-weight:800}
.card .meta{font-size:10px;display:flex;gap:6px;align-items:center}
.stock{letter-spacing:-1px;color:var(--sale)}
.card.rare{background:linear-gradient(160deg,#fff7cc,#ffe27a)}
.card.rare::after{content:"★レア";position:absolute;right:-24px;top:30px;transform:rotate(40deg);background:var(--sale);color:#fff;font-size:10px;font-weight:800;padding:1px 26px}
.card.flash{animation:flash .7s}
@keyframes flash{0%{transform:scale(.6) rotate(-6deg)}60%{transform:scale(1.08)}100%{transform:none}}
.reg{height:30px;background:#c7ccd9;display:flex;align-items:center;gap:4px;padding:0 6px;position:relative}
.reg .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--mint);width:0}
.reg .lbl{font-size:10px;font-weight:800}
.tagx{position:absolute;right:4px;font-size:10px;font-weight:800;border-radius:6px;padding:1px 4px;color:#fff}
.tagx.stop{background:#64748b}.tagx.fast{background:var(--mint)}.tagx.sale{background:var(--sale);animation:bob .6s infinite}
.q{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;overflow:hidden}
.p{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--emoji);font-size:22px;background:#e8ebf3;position:relative;flex:0 0 auto}
.p.front{animation:bob .6s infinite;background:#fff}
.p.actor{background:var(--c);box-shadow:0 0 0 3px var(--ink)}
.p.actor i{position:absolute;left:36px;top:8px;font-style:normal;font-family:var(--body);font-size:10px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:1px 4px;white-space:nowrap}
.p.me{box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--tag)}
.p.walking{opacity:.5;animation:bob .3s infinite}
.more{font-size:11px;font-weight:800;opacity:.6}
.join{margin:6px;padding:9px 0;border-radius:10px;background:var(--ink);color:#fff;font-weight:800;font-size:13px}
.join.here{background:var(--tag);color:var(--ink)}
.shop-bottom{background:var(--paper);padding:8px max(10px,env(safe-area-inset-left,0px)) 10px max(10px,env(safe-area-inset-right,0px));box-shadow:0 -3px 0 var(--shade);display:flex;flex-direction:column;gap:6px}
#pstatus{font-weight:800;font-size:13px;min-height:18px}
#qskills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.qs{flex:0 0 auto;min-width:62px;background:var(--floor);border-radius:12px;padding:5px 6px;display:flex;flex-direction:column;align-items:center;position:relative;box-shadow:0 3px 0 var(--shade)}
.qs .ic{font-family:var(--emoji);font-size:24px;line-height:1}
.qs .nm{font-size:10px;font-weight:800;white-space:nowrap}
.qs .n{position:absolute;right:-3px;top:-4px;background:var(--sale);color:#fff;border-radius:999px;font-size:11px;font-weight:800;min-width:20px;height:20px;line-height:20px}
.qs:active{transform:translateY(3px);box-shadow:none}
.qs.help{min-width:44px;background:var(--ink);color:#fff;justify-content:center;font-weight:800;font-size:12px}
.qs-empty{font-size:11px;opacity:.6;padding:8px 0}
.banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--display);font-size:44px;color:var(--sale);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);pointer-events:none;z-index:40;animation:pop .5s}
.banner small{display:block;font-size:18px;color:var(--ink);-webkit-text-stroke:0;text-shadow:none}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}

/* ---------- 共通モーダル・トースト ---------- */
#modal{position:fixed;inset:0;background:rgba(29,35,64,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60}
#modal[hidden]{display:none}
.sheet{background:var(--paper);width:min(100%,520px);max-height:86%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));animation:up .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 8px}
.sheet p{line-height:1.6;margin:6px 0;font-size:14px}
.sheet .row{display:flex;gap:10px;margin-top:12px}
.sheet .row .btn{flex:1}
.item-big{display:flex;gap:12px;align-items:center}
.item-big .ic{font-family:var(--emoji);font-size:54px;width:76px;height:76px;border-radius:16px;display:grid;place-items:center;background:var(--floor)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:10px}
.kv b{font-weight:800}
.inv-group h4{margin:12px 0 6px;font-size:13px;color:var(--cc)}
.inv-list{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--floor);border-radius:999px;padding:4px 10px 4px 6px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px}
.chip .emo{font-size:16px}
.howto ol{padding-left:20px;line-height:1.7;font-size:14px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:90%}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:pop .3s;text-align:center}
.toast.get{background:var(--tag);color:var(--ink);border:3px solid var(--ink);font-size:17px}
.toast.bad{background:var(--sale)}

/* ---------- 準備 ---------- */
#scr-loadout{padding:12px max(16px,env(safe-area-inset-left,0px)) 12px max(16px,env(safe-area-inset-right,0px));gap:8px;overflow-y:auto}
.panel{background:var(--paper);border-radius:14px;padding:10px 12px;box-shadow:0 3px 0 var(--shade)}
.panel h4{margin:0 0 6px;font-size:14px}
.skill-pick{display:flex;flex-direction:column;gap:6px}
.sp{background:var(--floor);border-radius:12px;padding:8px 10px;border:3px solid transparent;display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.sp.sel{border-color:var(--c-active);background:#ffe4ea}
.sp .ic{font-family:var(--emoji);font-size:30px;flex:0 0 auto}
.sp .txt{flex:1;min-width:0}
.sp .nm{font-size:13px;font-weight:800}
.sp .lv{font-size:10px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:0 5px;margin-left:4px}
.sp .chk{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:14px;background:#fff}
.sp.sel .chk{background:var(--c-active);color:#fff;border-color:var(--c-active)}
.d{font-size:11px;line-height:1.45;opacity:.85}
.fx{font-size:11px;font-weight:800;color:#be123c;line-height:1.4}
.irow{display:flex;gap:8px;align-items:center;background:var(--floor);border-radius:10px;padding:6px 8px;text-align:left;width:100%}
.irow .ic{font-family:var(--emoji);font-size:22px;flex:0 0 auto;width:30px;text-align:center}
.irow .txt{flex:1;min-width:0}
.irow .nm{font-size:12px;font-weight:800}
.irows{display:flex;flex-direction:column;gap:5px}
[data-info]{cursor:pointer}
.ib{display:inline-flex;align-items:center;gap:1px;background:var(--floor);border-radius:8px;padding:1px 5px;margin:1px 2px 1px 0;font-size:11px;font-weight:800}
.ib .emo{font-size:15px}
.hint{font-size:10px;opacity:.6}
#pauseBtn{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.95);font-size:16px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;font-size:12px}
.stats b{font-variant-numeric:tabular-nums}
.rivals{display:flex;flex-direction:column;gap:6px}
.rv{display:flex;align-items:center;gap:8px;font-size:12px}
.rv .face{font-family:var(--emoji);font-size:22px;width:36px;height:36px;border-radius:50%;background:var(--c);display:grid;place-items:center;border:2px solid var(--ink);flex:0 0 auto}
.rv .sk{font-family:var(--emoji);font-size:16px}

/* ---------- バトル ---------- */
#scr-battle{background:#2a2f4f}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.bhud{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;gap:4px;padding:6px max(8px,env(safe-area-inset-left,0px)) 0 max(8px,env(safe-area-inset-right,0px));z-index:5;align-items:flex-start}
.hp-chip{flex:1;background:rgba(255,255,255,.95);border-radius:10px;padding:3px 5px;display:flex;align-items:center;gap:4px;min-width:0}
.hp-chip.dead{opacity:.35}
.hp-chip .face{font-family:var(--emoji);font-size:18px;width:26px;height:26px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:0 0 auto}
.hp-chip .col{flex:1;min-width:0}
.hp-chip .nm{font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden}
.hp-chip .hb{height:6px;background:#e2e4ee;border-radius:3px;overflow:hidden}
.hp-chip .hb i{display:block;height:100%;background:#22c55e}
.hp-chip.me{box-shadow:0 0 0 3px var(--tag)}
.btime{position:absolute;top:calc(env(safe-area-inset-top,0px) + 46px);left:50%;transform:translateX(-50%);color:#fff;font-family:var(--display);font-size:14px;z-index:5;text-shadow:0 2px 0 #000;white-space:nowrap}
.controls{position:absolute;left:0;right:0;bottom:0;height:200px;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
#joyzone{position:absolute;left:0;top:0;bottom:0;width:52%;touch-action:none}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.35);left:calc(max(16px,env(safe-area-inset-left,0px)) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);pointer-events:none}
#knob{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.85);left:33px;top:33px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.abtn{position:absolute;border-radius:50%;display:grid;place-items:center;font-family:var(--emoji);touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#atkBtn{width:86px;height:86px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 36px);background:var(--sale);font-size:38px;border:4px solid #fff}
.sbtn{width:58px;height:58px;background:#fff;font-size:28px;border:3px solid var(--ink)}
.sbtn .cdv{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(29,35,64,.72) var(--p,0%),transparent 0)}
.sbtn .lvb{position:absolute;bottom:-4px;right:-4px;font-family:var(--body);font-size:10px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:0 4px}
.sbtn.ready{box-shadow:0 0 0 3px var(--tag),0 4px 0 rgba(0,0,0,.35)}
.bover{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:8;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.bover .big{font-family:var(--display);font-size:40px;color:#fff;text-shadow:3px 3px 0 #000;white-space:nowrap}

/* ---------- 結果 ---------- */
#scr-result{padding:16px max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px));gap:10px;overflow-y:auto;align-items:stretch}
.rank-hero{text-align:center;background:var(--tag);border:4px solid var(--ink);border-radius:18px;padding:14px;box-shadow:6px 6px 0 var(--ink)}
.rank-hero .r{font-family:var(--display);font-size:64px;color:var(--sale);-webkit-text-stroke:2px var(--ink);line-height:1}
.rank-hero .emo{font-size:46px}
.rank-list{display:flex;flex-direction:column;gap:6px}
.rank-row{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:12px;padding:8px 10px;font-weight:800}
.rank-row .no{font-family:var(--display);font-size:20px;width:36px}
.rank-row.me{box-shadow:0 0 0 3px var(--ink)}
/* ---------- 特殊要素 ---------- */
.poster{position:relative}
.secret{position:absolute;right:6px;bottom:4px;font-family:var(--emoji);font-size:15px;opacity:.13;width:26px;height:26px}

//  ユーティリティ

const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let FAST = false;
try { FAST = new URLSearchParams(location.search).has('fast'); } catch (e) {}

// =====================================================================
//  サウンド (WebAudioで合成)
// =====================================================================
const Snd = {
  ctx: null, on: true, master: null, bgmGain: null, timer: null, track: null, step: 0, nextT: 0, noise: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    this.ctx = new C();
    this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
    this.bgmGain = this.ctx.createGain(); this.bgmGain.gain.value = 0.28; this.bgmGain.connect(this.master);
    const len = this.ctx.sampleRate * 0.3, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
  },
  setOn(v) {
    this.on = v; if (this.master) this.master.gain.value = v ? 0.55 : 0;
    document.querySelectorAll('[data-mute]').forEach(b => b.textContent = v ? '🔊' : '🔇');
  },
  tone(f, t0, dur, type = 'square', vol = 0.15, slide = 0, dest) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(dest || this.master); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  hiss(t0, dur, vol = 0.2, freq = 1200) {
    if (!this.ctx) return;
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noise; f.type = 'bandpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t0); s.stop(t0 + dur);
  },
  se(name) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime, T = (f, d, ty, v, sl, dt = 0) => this.tone(f, t + dt, d, ty, v, sl);
    switch (name) {
      case 'beep': T(1760, 0.07, 'sine', 0.12); break;
      case 'buy': T(880, 0.1, 'square', 0.1); T(1175, 0.1, 'square', 0.1, 0, 0.08); T(1568, 0.22, 'square', 0.1, 0, 0.16); break;
      case 'rare': [784, 988, 1175, 1568, 1976].forEach((f, i) => T(f, 0.16, 'square', 0.09, 0, i * 0.06)); break;
      case 'tap': T(660, 0.05, 'triangle', 0.12); break;
      case 'walk': T(330, 0.06, 'triangle', 0.1); T(392, 0.06, 'triangle', 0.1, 0, 0.07); break;
      case 'cut': T(400, 0.18, 'sawtooth', 0.08, 1000); break;
      case 'banana': T(700, 0.35, 'triangle', 0.15, 150); this.hiss(t, 0.15, 0.1, 2000); break;
      case 'stop': T(220, 0.15, 'square', 0.1); T(196, 0.25, 'square', 0.1, 0, 0.16); break;
      case 'fast': T(500, 0.3, 'sawtooth', 0.06, 1600); break;
      case 'bell': T(1318, 0.4, 'sine', 0.15); T(1760, 0.5, 'sine', 0.1, 0, 0.12); break;
      case 'bad': T(300, 0.2, 'square', 0.1, 150); break;
      case 'tick': T(1200, 0.04, 'square', 0.06); break;
      case 'open': [523, 659, 784, 1047].forEach((f, i) => T(f, 0.25, 'triangle', 0.14, 0, i * 0.1)); break;
      case 'close': [784, 659, 523, 392].forEach((f, i) => T(f, 0.3, 'triangle', 0.14, 0, i * 0.14)); this.hiss(t + 0.5, 0.8, 0.08, 500); break;
      case 'swing': this.hiss(t, 0.08, 0.12, 2500); break;
      case 'hit': T(180, 0.12, 'square', 0.12, 70); this.hiss(t, 0.06, 0.15, 900); break;
      case 'skill': T(500, 0.22, 'triangle', 0.12, 1300); break;
      case 'boom': this.hiss(t, 0.4, 0.3, 400); T(120, 0.35, 'sine', 0.2, 40); break;
      case 'heal': [660, 880, 1100].forEach((f, i) => T(f, 0.15, 'sine', 0.1, 0, i * 0.07)); break;
      case 'ko': T(600, 0.6, 'square', 0.1, 80); break;
      case 'win': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => T(f, i === 5 ? 0.6 : 0.16, 'square', 0.1, 0, i * 0.13)); break;
      case 'lose': [392, 370, 349, 330].forEach((f, i) => T(f, 0.3, 'triangle', 0.13, 0, i * 0.25)); break;
      case 'fight': T(330, 0.15, 'square', 0.12); T(660, 0.4, 'square', 0.12, 0, 0.15); break;
    }
  },
  // BGM: 8分音符のステップシーケンサー (オリジナル曲)
  TRACKS: {
    shop: { bpm: 148, lead: 'square',
      mel: [72,0,76,79,77,76,74,0,72,74,76,72,69,0,71,0,72,0,76,79,81,79,77,76,74,76,77,74,72,0,0,0,
            77,0,81,77,76,0,79,76,74,0,77,74,72,74,76,0,77,0,81,84,83,81,79,77,76,74,72,71,72,0,0,0],
      bass:[48,0,55,0,52,0,55,0,53,0,57,0,55,0,59,0,48,0,55,0,52,0,55,0,53,0,55,0,48,0,48,0,

    battle: { bpm: 168, lead: 'sawtooth',
      mel: [69,0,72,69,76,0,74,72,71,0,74,71,79,0,77,76,69,0,72,69,76,77,79,81,79,77,76,74,76,0,0,0],
      bass:[45,45,57,45,45,45,57,45,43,43,55,43,43,43,55,43,41,41,53,41,41,41,53,41,40,40,52,40,44,44,47,52] },
    title: { bpm: 112, lead: 'triangle',
      mel: [76,0,79,0,84,0,83,81,79,0,76,0,77,0,74,0,72,0,76,0,79,0,81,79,77,76,74,0,72,0,0,0],
      bass:[48,0,0,0,52,0,0,0,53,0,0,0,55,0,0,0,48,0,0,0,57,0,0,0,53,0,55,0,48,0,0,0] },
  },
  bgm(name) {
    if (!this.ctx) return;
    if (this.track === name) return;
    this.stopBgm(); this.track = name; if (!name) return;
    this.step = 0; this.nextT = this.ctx.currentTime + 0.1;
    this.timer = setInterval(() => this.sched(), 60);
  },
  stopBgm() { clearInterval(this.timer); this.timer = null; this.track = null; },
  sched() {
    const tr = this.TRACKS[this.track]; if (!tr || !this.ctx) return;
    const stepDur = 60 / tr.bpm / 2;
    while (this.nextT < this.ctx.currentTime + 0.25) {
      const i = this.step % tr.mel.length, m = tr.mel[i], b = tr.bass[this.step % tr.bass.length];
      const mf = n => 440 * Math.pow(2, (n - 69) / 12);
      if (m) this.tone(mf(m), this.nextT, stepDur * 0.9, tr.lead, tr.lead === 'sawtooth' ? 0.06 : 0.09, 0, this.bgmGain);
      if (b) this.tone(mf(b), this.nextT, stepDur * 0.95, 'triangle', 0.16, 0, this.bgmGain);
      if (this.track === 'battle' && this.step % 2 === 0) this.tone(this.step % 4 === 0 ? 90 : 3000, this.nextT, 0.05, this.step % 4 === 0 ? 'sine' : 'square', this.step % 4 === 0 ? 0.25 : 0.02, this.step % 4 === 0 ? 40 : 0, this.bgmGain);
      this.nextT += stepDur; this.step++;
    }
  },
};

function newInv() { return { active: {}, passive: {}, stat: {}, queue: {}, count: 0 }; }
let actorSeq = 0;
function makeActor(c, isPlayer, opt = {}) {
  const inv = opt.inv || newInv();
  if (!opt.inv) {
    for (const k of ['active', 'queue', 'passive']) Object.assign(inv[k], JSON.parse(JSON.stringify(c.start[k] || {})));

    pref: { active: rnd(0.8, 1.3), passive: rnd(0.8, 1.3), stat: rnd(0.8, 1.3), queue: rnd(0.7, 1.2), bag: 1.1, gacha: 1 } };
}
function makeActors() {
  const pc = CHARS[G.charIdx];
  const pool = CHARS.filter(c => c !== pc && isUnlocked(c)).sort(() => Math.random() - 0.5);
  if (G.mode === 'boss') {
    const solo = [makeActor(pc, true)];
    if (pc.butler) solo.push(makeActor(BUTLER, false, { owner: solo[0], inv: solo[0].inv }));
    return solo;
  }
  const list = [makeActor(pc, true), ...pool.slice(0, 3).map(c => makeActor(c, false))];
  // 10%で「本気の店長」が5人目として乱入
  const tencho = CHARS.find(c => c.id === 'tencho');
  if (!list.some(a => a.char.id === 'tencho') && (FORCE_BOSS || Math.random() < 0.1)) {
    const b = makeActor(tencho, false, { boss: true, name: '本気の店長' });
    for (const q of IDS.queue) b.inv.queue[q] = (b.inv.queue[q] || 0) + 1;
    list.push(b);
  }
  // マダムには執事がつく (持ち物は共有)
  for (const a of [...list]) if (a.char.butler) list.push(makeActor(BUTLER, false, { owner: a, inv: a.inv }));
  return list;
}

// 商品を受け取る。福袋・ガチャは中身のアイコン一覧を返す
function giveItem(actor, it, mult = 1) {
  const def = ITEMS[it.id], inv = actor.inv;
  if (def.cat === 'gacha') {
    const got = [], g = FLYER.gacha || 1;
    for (let i = 0; i < mult; i++) {
      const r = Math.random(); let sub;
      if (r < 0.03 * g) sub = { id: pick(LEGEND_IDS), legend: true };
      else if (r < 0.03 * g + 0.07) sub = { id: 'lucky', rare: false };
      else { sub = genItem(); if (sub.id === 'lucky') sub = { id: pick(IDS.stat) }; sub.rare = r < 0.38; }
      const inner = giveItem(actor, sub, 1);
      got.push((sub.legend ? '★★' : sub.rare ? '★' : '') + ITEMS[sub.id].icon + (inner ? '(' + inner.join('') + ')' : ''));
      if (sub.legend) { addFeed(`🎰 ${actor.isPlayer ? 'あなた' : actor.name}がガチャで ★★${ITEMS[sub.id].name} を引いた！`); if (!actor.isPlayer) toast(`🎰 ${actor.name}がガチャで★★伝説を引いた！`, 'bad', 2200); }
    }
    return got;
  }
  inv.count += mult;
  if (def.cat === 'bag') {
    const got = [], n = (it.rare ? 5 : 3) * mult;
    for (let i = 0; i < n; i++) {
      let sub; do { sub = genItem(); } while (sub.id === 'lucky');
      sub.rare = false; giveItem(actor, sub, 1); got.push(ITEMS[sub.id].icon);
    }
    inv.count -= n;
    return got;
  }
  const m = (it.rare && !def.legend ? 2 : 1) * mult;
  inv[def.cat][it.id] = (inv[def.cat][it.id] || 0) + m;
  return null;
}

    return `<button class="char ${i === G.charIdx ? 'sel' : ''}" data-i="${i}" style="--c:${c.color}">

      <div class="trait">${c.trait}</div><div class="trait">初期: ${st}</div><div class="hint">アイコンをタップで効果</div></button>`;

// =====================================================================
//  買い物フェーズ
// =====================================================================
const SHOP_TIME = FAST ? 30 : 120;
const NAGE_TIME = FAST ? 8 : 20;   // 閉店前の投げ売り
const LEGEND_LANE = 11, GACHA_LANE = 10;
let pid = 0;

function newLane(i, kind = 'normal') {
  const l = { i, kind, item: null, stock: 0, speed: rnd(1.9, 3.3), progress: 0, queue: [], stopT: 0, fastT: 0, saleT: 0, flash: 0, closed: false, openT: 0 };
  if (kind === 'gacha') { l.item = { id: 'gacha' }; l.stock = Infinity; l.speed = 2.9; }
  else if (kind === 'legend') { l.item = { id: LEGEND_IDS[0], legend: true }; l.stock = 0; l.closed = true; l.speed = 2.4; }
  else { l.item = genItem(); l.stock = stockFor(l.item); }
  return l;
}
function stockFor(it) { return it.rare ? ri(1, 2) : ri(2, 5); }
function npc() { return { id: ++pid, emoji: pick(NPC_EMO), actor: null }; }
function laneRate(l) {
  let r = (1 / l.speed) * (l.fastT > 0 ? 3 : 1) * (l.saleT > 0 ? 2 : 1) * (S && S.nage ? 2 : 1);
  if (l.queue.some(p => p.actor && p.actor.char.conne)) r *= 1.6; // 店長のコネ
  return r;
}
const laneName = l => l.kind === 'gacha' ? 'ガチャ' : l.kind === 'legend' ? '伝説のレジ' : `レジ${l.i + 1}`;
const whoName = a => a.isPlayer ? 'あなた' : a.name;

function startShop() {
  S = { t: SHOP_TIME, lanes: [], banned: new Set(), spawnT: 0, saleT: rnd(14, 20) * (FLYER.sale || 1), leaveT: 1, feed: [], ended: false,
    renderT: 0, sig: [], cardSig: [], viewLane: 0, maxV: 9, nage: false,
    legendAt: [SHOP_TIME * rnd(0.58, 0.7), SHOP_TIME * rnd(0.25, 0.36)] };
  G.actors = makeActors();
  // 店長のコネ：商品3つを先にもらい、その商品は売り場に出なくなる
  for (const a of G.actors) if (a.char.conne) {
    const pool = [...IDS.active, ...IDS.passive, ...IDS.stat].filter(id => !S.banned.has(id)).sort(() => Math.random() - 0.5).slice(0, 3);
    for (const id of pool) { S.banned.add(id); giveItem(a, { id }); }
    a.conneItems = pool;
  }
  for (let i = 0; i < 10; i++) { const l = newLane(i); const n = ri(2, 7); for (let k = 0; k < n; k++) l.queue.push(npc()); S.lanes.push(l); }
  const g = newLane(GACHA_LANE, 'gacha'); for (let k = 0; k < 4; k++) g.queue.push(npc()); S.lanes.push(g);
  S.lanes.push(newLane(LEGEND_LANE, 'legend'));
  show('scr-shop');
  $('#paceTag').textContent = G.pace === 0.6 ? '（ゆっくり）' : G.pace === 0.4 ? '（のんびり）' : '';
  buildLanes(); measureQueue(); renderShop(true);
  Snd.bgm('shop'); Snd.se('open');
  banner('開店！', G.mode === 'boss' ? 'ラスボス戦：力をたくわえろ！' : `本日のチラシ：${FLYER.name}`, 1500);
  const me = player();
  if (me.conneItems) setTimeout(() => toast(`🧑‍💼 店長のコネで入手：<span class="emo">${me.conneItems.map(id => ITEMS[id].icon).join(' ')}</span><br><small>この商品は売り場に出ない</small>`, 'get', 3200), 900);
  const boss = G.actors.find(a => a.boss);
  if (boss) setTimeout(() => { banner('店長が本気で参戦！', '倒して1位になると…？', 2200); Snd.se('stop'); addFeed('🧑‍💼 本気の店長が買い物に参戦！'); }, 1700);
  lastT = performance.now();
}
function banner(txt, sub, ms = 1500) {
  const host = G.screen === 'scr-battle' ? $('#scr-battle') : $('#app');
  document.querySelectorAll('.banner').forEach(x => x.remove());
  const b = document.createElement('div'); b.className = 'banner'; b.innerHTML = txt + (sub ? `<small>${sub}</small>` : '');
  host.appendChild(b); setTimeout(() => b.remove(), ms);
}
function addFeed(msg) { if (!S) return; S.feed.unshift(msg); S.feed.length = 4; const f = $('#feed'); if (f) f.innerHTML = S.feed[0] || ''; }

function buildLanes() {
  const box = $('#lanes'); box.innerHTML = '';
  const mm = $('#minimap'); mm.innerHTML = '';
  S.lanes.forEach((l, i) => {
    const el = document.createElement('div'); el.className = 'lane ' + l.kind; el.dataset.i = i;
    el.innerHTML = `<div class="card"></div><div class="reg"><span class="emo">🧾</span><span class="lbl">レジ</span><span class="tg"></span><div class="bar"></div></div><div class="q"></div><button class="join"></button>`;
    el.querySelector('.card').onclick = () => { Snd.se('tap'); showItemDetail(i); };
    el.querySelector('.join').onclick = () => playerJoin(i);
    box.appendChild(el);
    const b = document.createElement('button'); b.className = 'mm'; b.dataset.i = i;
    b.onclick = () => scrollToLane(i);
    mm.appendChild(b);
  });
  box.onscroll = () => {
    const els = [...box.children].filter(e => !e.hidden);
    let best = 0, bd = 1e9; els.forEach(e => { const d = Math.abs(e.offsetLeft - 12 - box.scrollLeft); if (d < bd) { bd = d; best = +e.dataset.i; } });
    S.viewLane = best;
  };
}
function scrollToLane(i) { const el = $('#lanes').children[i]; if (el) $('#lanes').scrollTo({ left: Math.max(0, el.offsetLeft - 12), behavior: 'smooth' }); Snd.se('tap'); }
function measureQueue() {
  const q = document.querySelector('.lane .q');
  if (q) S.maxV = Math.max(4, Math.floor((q.clientHeight - 10) / 36));
}
window.addEventListener('resize', () => { if (S && G.screen === 'scr-shop') { measureQueue(); renderShop(true); } if (B) layoutBattle(); });

function player() { return G.actors.find(a => a.isPlayer); }
function posInLane(a) { if (a.lane === null) return -1; return S.lanes[a.lane].queue.findIndex(p => p.actor === a); }
function removeFromLane(a) {
  if (a.lane !== null) { const q = S.lanes[a.lane].queue; const k = q.findIndex(p => p.actor === a); if (k >= 0) q.splice(k, 1); if (k === 0) S.lanes[a.lane].progress = 0; }
  a.lane = null;
}
function joinLane(a, i) {
  if (a.lane === i || a.walkTo === i || S.lanes[i].closed) return;
  removeFromLane(a); a.walkTo = i; a.walkT = a.char.walk;
}
function playerJoin(i) {
  if (!S || S.ended) return;
  const p = player();
  if (p.lane === i || p.walkTo === i) return;
  if (S.lanes[i].closed) { toast('このレジは閉まっている', 'bad'); return; }
  Snd.se('walk'); joinLane(p, i);
}
function moveTo(l, idx, newIdx) { const [x] = l.queue.splice(idx, 1); l.queue.splice(newIdx, 0, x); if (idx === 0 || newIdx === 0) l.progress = 0; }

// ---- 伝説のレジ ----
function openLegend() {
  const l = S.lanes[LEGEND_LANE];
  l.closed = false; l.item = { id: pick(LEGEND_IDS), legend: true }; l.stock = 1; l.openT = 25; l.progress = 0; l.flash = 1;
  l.queue = []; for (let k = 0; k < ri(2, 4); k++) l.queue.push(npc());
  const d = ITEMS[l.item.id];
  banner('伝説のレジ 出現！', `${d.icon} ★★${d.name} が1個だけ！`, 2200);
  toast(`✨ 伝説のレジ：${d.icon} ★★${d.name}<br><small>ミニマップの右端からすぐ行ける</small>`, 'get', 2600);
  addFeed(`✨ 伝説のレジに ★★${d.name}！`);
  Snd.se('rare');
}
function closeLegend(msg) {
  const l = S.lanes[LEGEND_LANE];
  l.closed = true; l.stock = 0;
  for (const p of l.queue) if (p.actor) p.actor.lane = null;
  for (const a of G.actors) if (a.walkTo === LEGEND_LANE) a.walkTo = null;
  l.queue = [];
  // 閉まったレジの表示も空にする (前に並んでいた人の姿が残らないように)
  const el = $('#lanes').children[LEGEND_LANE];
  if (el) { el.querySelector('.q').innerHTML = ''; el.hidden = true; }
  S.sig[LEGEND_LANE] = null; S.cardSig[LEGEND_LANE] = null;
  if (msg) addFeed(msg);
}

function shopUpdate(dt) {
  if (!S || S.ended) return;
  const prevSec = Math.ceil(S.t);
  S.t -= dt;
  if (S.t <= 10 && Math.ceil(S.t) !== prevSec && S.t > 0) Snd.se('tick');
  if (S.t <= 0) { S.t = 0; endShop(); return; }
  // 閉店前の投げ売り
  if (!S.nage && S.t <= NAGE_TIME) {
    S.nage = true;
    for (const l of S.lanes) if (l.kind === 'normal') { l.item.rare = true; l.stock = Math.max(l.stock, 1); l.flash = 1; }
    banner('投げ売りタイム！', '全レジ2倍速・全部★レア', 2000); Snd.se('bell');
    addFeed('📣 閉店前の投げ売り！全レジ2倍速・全部★レア');
  }
  // 伝説のレジ
  if (S.legendAt.length && S.t <= S.legendAt[0]) { S.legendAt.shift(); if (S.lanes[LEGEND_LANE].closed) openLegend(); }
  const lg = S.lanes[LEGEND_LANE];
  if (!lg.closed) { lg.openT -= dt; if (lg.openT <= 0) closeLegend('✨ 伝説のレジは閉まった…'); }
  // 一般客の来店
  // 店内の一般客を「開いている列×6人」くらいに保つ。少ないほど来店が速くなる
  S.spawnT -= dt;
  if (S.spawnT <= 0) {
    const open = S.lanes.filter(l => !l.closed);
    const npcs = open.reduce((s, l) => s + l.queue.filter(q => !q.actor).length, 0);
    const target = open.length * 6;
    const short = npcs / target;
    S.spawnT = short < 0.7 ? rnd(0.05, 0.1) : short < 1 ? rnd(0.15, 0.3) : rnd(0.5, 0.9);
    if (npcs < target * 1.4) {
      const l = wpick(open.map(l => [l, (l.item.rare ? 3 : 1) * (l.saleT > 0 ? 3 : 1) * (l.kind === 'legend' ? 4 : l.kind === 'gacha' ? 1.2 : 1) * (l.queue.length < 2 ? 3 : 1) / (1 + l.queue.length * 0.22)]));
      l.queue.push(npc());
    }
  }
  // 毎秒の処理: 長すぎる列から一般客が帰る／転売ヤーは割り込まれる／マダムのCT
  S.leaveT -= dt;
  if (S.leaveT <= 0) {
    S.leaveT = 1;
    for (const l of S.lanes) if (l.queue.length > 11 && Math.random() < 0.3) {
      for (let k = l.queue.length - 1; k > l.queue.length - 4 && k > 0; k--) if (!l.queue[k].actor) { l.queue.splice(k, 1); break; }
    }
    for (const a of G.actors) if (a.char.hoarder && a.lane !== null && Math.random() < 0.22) {
      const l = S.lanes[a.lane], pos = posInLane(a);
      const k = l.queue.findIndex((p, j) => j > pos && !p.actor);
      if (pos >= 0 && k > pos) {
        moveTo(l, k, pos);
        addFeed(`😤 一般客が${whoName(a)}の前に割り込んだ！「転売ヤーには譲らない」`);
        if (a.isPlayer) toast('😤 一般客に割り込まれた…', 'bad');
      }
    }
  }
  // タイムセール
  S.saleT -= dt;
  if (S.saleT <= 0) {
    S.saleT = rnd(20, 28) * (FLYER.sale || 1);
    const cand = S.lanes.filter(l => l.kind === 'normal' && l.saleT <= 0);
    if (cand.length) {
      const l = pick(cand);
      l.saleT = 12; l.item = { id: l.item.id, rare: true }; l.stock = Math.max(l.stock, 2); l.flash = 1;
      addFeed(`📣 タイムセール！${laneName(l)}で ${itemLabel(l.item)}`);
      toast(`📣 タイムセール！<br>${laneName(l)}：${ITEMS[l.item.id].icon} ${itemLabel(l.item)}`, 'bad', 2200);
      Snd.se('bell');
    }
  }
  // 移動中の人
  for (const a of G.actors) {
    if (a.payCd > 0) a.payCd -= dt;
    if (a.walkTo !== null) {
      a.walkT -= dt;
      if (a.walkT <= 0) {
        const l = S.lanes[a.walkTo];
        if (l.closed) { a.walkTo = null; continue; }
        l.queue.push({ id: ++pid, emoji: a.emoji, actor: a }); a.lane = a.walkTo; a.walkTo = null;
      }
    }
  }
  // レジ処理
  for (const l of S.lanes) {
    if (l.closed) continue;
    if (l.saleT > 0) l.saleT -= dt;
    if (l.fastT > 0) l.fastT -= dt;
    if (l.stopT > 0) { l.stopT -= dt; continue; }
    if (!l.queue.length) { l.progress = 0; continue; }
    l.progress += dt * laneRate(l);
    if (l.progress >= 1) { l.progress = 0; serve(l); }
  }
  // ライバルAI
  for (const a of G.actors) if (!a.isPlayer) rivalShopAI(a, dt);
}
function serve(l) {
  const p = l.queue.shift(); if (!p) return;
  if (!p.actor) {
    // 一般客は普通の商品だけ買う (伝説は高すぎて買えない・ガチャは無限)
    if (l.kind === 'normal' && Math.random() < 0.6) { l.stock--; if (G.screen === 'scr-shop' && l.i === S.viewLane) Snd.se('beep'); }
  } else {
    const a = p.actor, owner = a.owner || a; a.lane = null;
    let mult = 1;
    if (owner.char.hoarder && l.stock >= 2) mult = 2;      // 転売ヤーはいつも2個
    if (a.hoard > 0 && l.stock >= mult + 1) { mult += 1; a.hoard--; }
    const it = l.item, got = giveItem(owner, it, mult);
    l.stock -= mult;
    owner.log.push(it);
    const via = a.isButler ? `（${a.name}が代わりに）` : '';
    const name = `${ITEMS[it.id].icon} ${itemLabel(it)}${mult > 1 ? ' ×' + mult : ''}`;
    const gotTxt = got ? `<br><span class="emo">${got.join(' ')}</span>` : '';
    if (owner.isPlayer) {
      Snd.se(it.rare || it.legend || l.kind === 'legend' ? 'rare' : 'buy');
      toast(`ゲット！${via} ${name}${gotTxt}`, 'get', 2200);
      addFeed(`🧺 あなた${via}が ${name} を買った`);
    } else {
      addFeed(`${owner.emoji} ${owner.name}${via}が ${name} を買った`);

}

      if (k < 0) for (let j = pos - 1; j >= 0; j--) if (!l.queue[j].actor || !l.queue[j].actor.char.gmen) { k = j; break; }
      if (k < 0) return fail('前の人は転ばない（Gメンだ…）');
      const v = l.queue[k];
      moveTo(l, k, l.queue.length - 1);
      Snd.se('banana');
      const vn = v.actor ? whoName(v.actor) : 'お客さん';

      else if (me) toast(`🍌 ${vn}を転ばせた！`);

      const p = player();
      if (!me && p.lane !== null && S.lanes[p.lane].stopT > 0 && p.lane !== a.lane) toast(`🗣️ ${a.name}の井戸端会議でレジが止まった！`, 'bad', 2000);
      else if (me) toast(`🗣️ ${n}列のレジを止めた！`);

      if (me) toast('🏃 レジが3倍速！');

// ---- ライバルの買い物AI ----
function itemValue(a, it) {
  const def = ITEMS[it.id], inv = a.inv, pref = a.pref[def.cat] || 1;
  if (def.legend) return 32;
  let v = 6;
  if (def.cat === 'active') {
    const owned = Object.keys(inv.active).filter(k => !ITEMS[k].sig).length;
    v = inv.active[it.id] ? 8.5 : owned < 3 ? 10 : 4.5;
  } else if (def.cat === 'passive') v = 7;
  else if (def.cat === 'stat') v = 6;

  else if (def.cat === 'gacha') v = 7.5;

}
function laneScore(a, l, ahead, npcAhead, actorsAhead) {
  if (l.closed) return 0;
  const consume = (l.kind === 'normal' ? 0.6 * npcAhead : 0) + actorsAhead;
  const ok = l.stock - consume >= 0.8 ? 1 : l.kind === 'legend' ? 0.1 : 0.45;
  const eta = (ahead + (1 - l.progress)) / laneRate(l) + l.stopT;
  if (eta > S.t || (l.kind === 'legend' && eta > l.openT)) return 0;
  return itemValue(a, l.item) * ok / (eta + 0.8);
}
function scoreForJoin(a, l) {

}
function rivalShopAI(a, dt) {
  const D = DIFF[G.diff];
  if (a.walkTo !== null) return;
  a.think -= dt;
  if (a.lane === null) {
    if (a.think > 0) return;
    a.think = rnd(0.2, 0.6) * D.think;
    let best = null, bs = -1;
    for (const l of S.lanes) {
      if (a.isButler && a.owner.lane === l.i) continue; // 執事は主と別の列へ
      const s = scoreForJoin(a, l) * (Math.random() < D.smart ? 1 : rnd(0.3, 1.7));
      if (s > bs) { bs = s; best = l; }
    }
    if (best && bs > 0) joinLane(a, best.i);
  } else {
    if (a.think <= 0) {
      a.think = rnd(2.5, 4) * D.think;
      const l = S.lanes[a.lane], pos = posInLane(a);
      if (pos > 1) {
        const ahead = l.queue.slice(0, pos), npcs = ahead.filter(p => !p.actor).length;
        const cur = laneScore(a, l, pos, npcs, pos - npcs);
        let best = null, bs = cur * 2.3;
        for (const o of S.lanes) if (o !== l) { const s = scoreForJoin(a, o); if (s > bs) { bs = s; best = o; } }
        if (best && Math.random() < D.smart) joinLane(a, best.i);
      }
    }
    if (a.isButler) return;
    a.qThink -= dt;
    if (a.qThink <= 0) { a.qThink = rnd(0.8, 1.6); if (Math.random() < D.qskill) rivalQueueSkill(a); }
  }
}
function rivalQueueSkill(a) {
  const q = a.inv.queue, l = a.lane !== null ? S.lanes[a.lane] : null; if (!l) return;
  const pos = posInLane(a); if (pos < 0) return;
  const v = itemValue(a, l.item);
  if (a.char.pay && pos >= 2 && a.payCd <= 0) return useQueueSkill(a, 'pay');

  const gmenHere = l.queue.some(p => p.actor && p.actor.char.gmen && p.actor !== a);

function gimmickUpdate(dt) {
  // 落ちているアイテム
  B.pickT -= dt;
  if (B.pickT <= 0) {
    B.pickT = B.st.pickupT * rnd(0.8, 1.2);
    if (B.pickups.length < 5) { const p = freeSpot(); B.pickups.push({ ...p, kind: pick(Object.keys(PICKUPS)), t: 0 }); }
  }

      pk.used = true;
      if (pk.kind === 'heal') f.hp = Math.min(f.maxHp, f.hp + f.maxHp * 0.25);
      if (pk.kind === 'power') f.powT = 8;
      if (pk.kind === 'speed') f.spdT = 8;
      if (pk.kind === 'guard') { f.shield = Math.max(f.shield, f.maxHp * 0.25); f.shieldT = 6; }
      addText(f.x, f.y - 34, PICKUPS[pk.kind].txt, '#ffd43b', 15); burst(pk.x, pk.y, '#ffd43b', 10);
      if (f.isPlayer) Snd.se('heal');

    B.gimT = rnd(3.5, 5.5);

  }
  for (const c of B.carts) {
    if (c.warn > 0) { c.warn -= dt; continue; }
    c.x += c.vx * dt;
    for (const f of B.fs) if (f.alive && !c.hit.has(f) && Math.abs(f.x - c.x) < f.r + 18 && Math.abs(f.y - c.y) < f.r + 14) {
      c.hit.add(f); f.kx += Math.sign(c.vx) * 420; f.ky += rnd(-120, 120);
      damage(null, f, 14, { hazard: 1 }); Snd.se('hit');
    }
  }
  B.carts = B.carts.filter(c => c.x > -80 && c.x < B.W + 80);

      for (const f of B.fs) if (f.alive && inRect(f.x, f.y, { x: fl.x - f.r, y: fl.y - f.r, w: fl.w + 2 * f.r, h: fl.h + 2 * f.r })) damage(null, f, 22, { hazard: 1, stun: 0.6 });
    }
  }
  B.falls = B.falls.filter(fl => fl.t > -0.4);
}

function battleUpdate(dt) {
  if (!B) return;
  if (B.start > 0) {
    const prev = Math.ceil(B.start); B.start -= dt;
    if (Math.ceil(B.start) !== prev) { if (B.start > 0) { banner(String(Math.ceil(B.start)), '', 600); Snd.se('tick'); } else { banner('ファイト！', '', 800); Snd.se('fight'); } }
    return;
  }
  if (B.over) return;
  B.t += dt;
  // 閉店シャッター (場外縮小)
  const k = B.mode === 'boss' ? 0 : clamp((B.t - 35) / 45, 0, 1), fw = 240, fh = 320;
  B.zone = { x0: k * (B.W - fw) / 2, x1: B.W - k * (B.W - fw) / 2, y0: k * (B.H - fh) / 2, y1: B.H - k * (B.H - fh) / 2 };
  if (B.mode !== 'boss' && B.t > 35 && B.t - dt <= 35) { banner('閉店シャッター！', '外側にいるとダメージ', 1500); Snd.se('stop'); }
  gimmickUpdate(dt);
  warnUpdate(dt);

  for (const f of B.fs) {
    if (!f.alive) continue;
    f.atkCd -= dt; f.swingT -= dt; f.hitT -= dt; f.spinT = (f.spinT || 0) - dt;
    for (const key of ['hasteT', 'markT', 'slowT', 'stunT', 'powT', 'spdT', 'stealthT']) if (f[key] > 0) f[key] -= dt;
    if (f.shieldT > 0) { f.shieldT -= dt; if (f.shieldT <= 0) f.shield = 0; }
    for (const s of f.skills) if (s.cd > 0) s.cd -= dt;
    if (f.regen) f.hp = Math.min(f.maxHp, f.hp + f.maxHp * f.regen * dt);
    if (!inZone(f.x, f.y)) { f.zoneTick = (f.zoneTick || 0) + dt; if (f.zoneTick > 0.5) { f.zoneTick = 0; damage(null, f, f.maxHp * 0.05, { zone: 1 }); addText(f.x, f.y - 26, '場外', '#ff6b6b', 13); } }
    if (!f.alive) continue;
    let mv = { x: 0, y: 0 };
    if (f.isPlayer) { mv = playerMoveVec(); if (input.atk || input.keys[' '] || input.keys.j) basicAttack(f); }
    else mv = f.queen ? queenAI(f, dt) : aiUpdate(f, dt);
    const sp = f.spd * (f.hasteT > 0 ? 1.4 : 1) * (f.spdT > 0 ? 1.35 : 1) * (f.slowT > 0 ? 0.55 : 1);
    if (f.stunT > 0) mv = { x: 0, y: 0 };
    const ox = f.x, oy = f.y;
    if (f.dashT > 0) {
      f.dashT -= dt; f.x += f.dashX * dt; f.y += f.dashY * dt;
      for (const o of enemies(f)) if (!f.dashHit.has(o) && Math.hypot(o.x - f.x, o.y - f.y) < f.r + o.r + 6) { f.dashHit.add(o); damage(f, o, f.dashDmg, { skill: 1, knock: f.dashKnock }); }
      if (Math.random() < 0.7) B.parts.push({ x: f.x, y: f.y, vx: 0, vy: 0, t: 0.3, color: f.gold ? '#ffd43b' : f.color, r: f.gold ? 9 : 6 });
    } else {
      f.x += mv.x * sp * dt; f.y += mv.y * sp * dt;

  for (const c of B.carts) if (c.warn <= 0) { cx.save(); cx.translate(c.x, c.y); if (c.vx > 0) cx.scale(-1, 1); cx.font = `34px ${EF}`; cx.fillText('🛒', 0, 0); cx.restore(); }
  for (const p of B.proj) {
    cx.save(); cx.translate(p.x, p.y - (p.z || 0));
    if (p.kind === 'lob') { cx.fillStyle = 'rgba(0,0,0,.18)'; cx.beginPath(); cx.ellipse(0, p.z || 0, 8, 3, 0, 0, 6.28); cx.fill(); }
    cx.rotate(p.rot || 0); cx.font = `${p.kind === 'lob' ? 20 : 18}px ${EF}`; cx.fillText(p.icon, 0, 0); cx.restore();
  }
  for (const p of B.parts) { cx.globalAlpha = Math.min(1, p.t * 3); cx.fillStyle = p.color; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.28); cx.fill(); }
  cx.globalAlpha = 1;
  for (const t of B.texts) {
    cx.globalAlpha = Math.min(1, t.t * 2.5); cx.font = `800 ${t.size}px "M PLUS Rounded 1c",sans-serif`;
    cx.lineWidth = 3; cx.strokeStyle = '#1d2340'; cx.strokeText(t.txt, t.x, t.y); cx.fillStyle = t.color; cx.fillText(t.txt, t.x, t.y);
  }
  cx.globalAlpha = 1;
  // 画面座標で描くもの
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (st.dark) { // 深夜のコンビニ: 自分の周りだけ明るい
    const c = toScreen(fc.x, fc.y), R = 210 * sc;
    const g = cx.createRadialGradient(c.x, c.y, R * 0.35, c.x, c.y, R);
    g.addColorStop(0, 'rgba(5,6,20,0)'); g.addColorStop(1, 'rgba(5,6,20,.86)');
    cx.fillStyle = g; cx.fillRect(0, 0, sw, cv.height / dpr);
  }
  // 画面の外にいる相手の矢印
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (const f of B.fs) {
    if (!f.alive || f.isPlayer || f.stealthT > 0) continue;
    const p = toScreen(f.x, f.y);
    if (p.x > 0 && p.x < sw && p.y > top && p.y < top + ah) continue;
    const ex = clamp(p.x, 22, sw - 22), ey = clamp(p.y, top + 22, top + ah - 22);
    const a = Math.atan2(p.y - ey, p.x - ex);
    cx.fillStyle = f.color; cx.beginPath(); cx.arc(ex, ey, 15, 0, 6.28); cx.fill();
    cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.stroke();
    cx.fillStyle = '#fff'; cx.beginPath(); cx.moveTo(ex + Math.cos(a) * 24, ey + Math.sin(a) * 24); cx.lineTo(ex + Math.cos(a + 2.6) * 14, ey + Math.sin(a + 2.6) * 14); cx.lineTo(ex + Math.cos(a - 2.6) * 14, ey + Math.sin(a - 2.6) * 14); cx.fill();
    cx.font = `15px ${EF}`; cx.fillText(f.emoji, ex, ey + 1);

}
function updateBattleHUD() {
  document.querySelectorAll('#bhud .hp-chip').forEach(c => {
    const f = B.fs[+c.dataset.i]; c.querySelector('.hb i').style.width = Math.max(0, f.hp / f.maxHp * 100) + '%'; c.classList.toggle('dead', !f.alive);
  });
  const me = B.me;
  document.querySelectorAll('#sbtns .sbtn').forEach(b => {
    const s = me.skills[+b.dataset.s]; const p = s.cd > 0 ? (s.cd / s.max) * 100 : 0;
    b.querySelector('.cdv').style.setProperty('--p', p + '%'); b.classList.toggle('ready', s.cd <= 0 && me.alive);
  });
  const qf = B.fs.find(f => f.queen);
  const z = qf ? `経過 ${B.t.toFixed(0)}秒 ／ ${qf.q.phase === 2 ? '本気モード！' : '第1形態'}` : B.t < 35 ? `閉店シャッターまで ${Math.ceil(35 - B.t)}秒` : '閉店シャッター 作動中！';
  const el = $('#btime'); const txt = B.start > 0 ? '' : `${B.st.icon} ${z}`; if (el.textContent !== txt) el.textContent = txt;
}

// ---- ラスボス「セールクイーン」 ----
const QUEEN_FOODS = ['🥫', '🍅', '🥕', '🧅', '🍋', '🥚', '🍞'];
function queenAI(f, dt) {
  const q = f.q, t = B.me.alive ? B.me : nearest(f);
  if (!t) return { x: 0, y: 0 };
  if (q.phase === 1 && f.hp < f.maxHp * 0.5) {
    q.phase = 2; f.spd *= 1.25; f.aspd *= 1.3; f.shield = f.maxHp * 0.12; f.shieldT = 6;
    for (const s of f.skills) s.max *= 0.7;
    banner('本気モード！', '「閉店間際の大安売りよ！」', 2200); Snd.se('stop'); B.shake = 0.4;
    burst(f.x, f.y, '#ef4444', 30, 260); q.patT = 1.2;
  }
  const dx = t.x - f.x, dy = t.y - f.y, d = Math.hypot(dx, dy) || 1;
  if (q.cast > 0) { q.cast -= dt; return { x: 0, y: 0 }; }
  q.patT -= dt;
  if (q.patT <= 0) {
    q.patT = (q.phase === 2 ? rnd(1.5, 2.2) : rnd(2.4, 3.2)) * (G.diff === 0 ? 1.3 : G.diff === 2 ? 0.85 : 1);
    queenPattern(f, t);
  }
  for (let i = 0; i < f.skills.length; i++) {
    const s = f.skills[i]; if (s.cd > 0) continue;
    const use = { tuna: d < 110, bag: d < 100, egg: d < 320, flyer: d < 280, seal: d < 300 }[s.id];
    if (use) { useSkill(f, i); break; }
  }
  if (d - t.r < 54) basicAttack(f);
  return d > 70 ? { x: dx / d, y: dy / d } : { x: -dy / d * 0.6, y: dx / d * 0.6 };
}
function queenSay(f, txt) { addText(f.x, f.y - 52, txt, '#facc15', 17); }
function queenPattern(f, t) {
  const q = f.q, clerks = B.fs.filter(o => o.summoned && o.alive).length;
  const pats = ['slam', 'slam', 'charge', 'barrage'];
  if (clerks < 2) pats.push('summon');
  if (q.phase === 2) pats.push('rain', 'rain', 'barrage');
  const p = pick(pats), fast = q.phase === 2 ? 0.75 : 1;
  if (p === 'slam') {
    queenSay(f, '特売ドーン！');
    B.warns.push({ kind: 'circle', x: t.x, y: t.y, r: 95, t: 1.2 * fast, max: 1.2 * fast, owner: f, dmg: f.atk * 3, stun: 0.6 });
  } else if (p === 'rain') {
    queenSay(f, 'タイムセールの雨よ！');
    for (let i = 0; i < 6; i++) { const x = clamp(t.x + rnd(-230, 230), 40, B.W - 40), y = clamp(t.y + rnd(-230, 230), 40, B.H - 40); B.warns.push({ kind: 'circle', x, y, r: 70, t: 1.3 + i * 0.12, max: 1.3 + i * 0.12, owner: f, dmg: f.atk * 2 }); }
    if (Math.random() < 0.5) B.warns.push({ kind: 'circle', x: t.x, y: t.y, r: 70, t: 1.4, max: 1.4, owner: f, dmg: f.atk * 2 });
  } else if (p === 'charge') {
    queenSay(f, 'カート大暴走！');
    const a = aimAt(f, t);
    B.warns.push({ kind: 'line', x: f.x, y: f.y, dx: a.x, dy: a.y, len: 560, w: 70, t: 1.0 * fast, max: 1.0 * fast, owner: f });
    q.cast = 1.0 * fast;
  } else if (p === 'barrage') {
    queenSay(f, '全品投げ売り！');
    const rings = q.phase === 2 ? 2 : 1;
    for (let r = 0; r < rings; r++) B.warns.push({ kind: 'ring', t: 0.35 + r * 0.45, max: 0.35 + r * 0.45, owner: f, off: r * 0.2, n: q.phase === 2 ? 20 : 16 });
    q.cast = 0.35;
  } else if (p === 'summon') {
    queenSay(f, '店員さん、手伝って！');
    for (let i = 0; i < 3; i++) summonClerk(f, f.x + Math.cos(i * 2.1) * 60, f.y + Math.sin(i * 2.1) * 60);
    Snd.se('bell');
  }
}
function summonClerk(boss, x, y) {
  const ch = { id: 'clerk', name: '店員', emoji: pick(['🧑‍🔧', '👩‍🔧', '🧑‍🍳', '👨‍💼']), color: '#fde68a', hp: 55, atk: 6, def: 0.5, spd: 118, aspd: 0.9, walk: 1, cut: 3, chat: 7, start: { active: {}, queue: {} } };
  const a = makeActor(ch, false, { owner: boss.actor, inv: newInv() });
  const f = buildFighter(a);
  f.summoned = true; f.x = clamp(x, 30, B.W - 30); f.y = clamp(y, 30, B.H - 30);
  for (const w of B.walls) collideCircleRect(f, w);
  B.fs.push(f); burst(f.x, f.y, '#fde68a', 10);
}
function warnUpdate(dt) {
  for (const w of B.warns) {
    w.t -= dt;
    if (w.t > 0 || w.done) continue;
    w.done = true;
    const f = w.owner; if (!f.alive) continue;
    if (w.kind === 'circle') {
      B.fx.push({ kind: 'ring', x: w.x, y: w.y, r: w.r, t: 0.35, max: 0.35, color: '#ef4444' }); burst(w.x, w.y, '#fca5a5', 14, 200); Snd.se('boom');
      B.shake = Math.max(B.shake, 0.15);
      for (const o of enemies(f)) if (Math.hypot(o.x - w.x, o.y - w.y) < w.r + o.r * 0.5) {
        const k = aimAt({ x: w.x, y: w.y, dir: { x: 0, y: 1 } }, o); o.kx += k.x * 260; o.ky += k.y * 260;
        damage(f, o, w.dmg, { stun: w.stun || 0 });
      }
    } else if (w.kind === 'line') {
      startDash(f, { x: w.dx, y: w.dy }, 980, 0.56, f.atk * 2.6, 420, true);
      Snd.se('skill');
    } else if (w.kind === 'ring') {
      for (let i = 0; i < w.n; i++) {
        const a = (i / w.n + w.off) * Math.PI * 2;
        B.proj.push({ kind: 'line', x: f.x, y: f.y, vx: Math.cos(a) * 215, vy: Math.sin(a) * 215, r: 11, owner: f, dmg: f.atk * 0.8, life: 2.8, icon: pick(QUEEN_FOODS), hit: new Set(), rot: 0 });
      }
      Snd.se('swing');
    }
  }
  B.warns = B.warns.filter(w => !w.done);
}
function showQueenResult() {
  const qf = B.fs.find(f => f.queen), win = !qf.alive, time = B.t;
  let newBest = false;

    ${q && q.wins ? `<div class="panel" style="text-align:center"><span class="queen-title">👑 ${queenTitle()}</span><p class="hint" style="margin:6px 0 0">撃破 ${q.wins}回 ／ 最速 ${q.best.toFixed(1)}秒${q.hard ? '' : ' ／ 「激戦」で倒すと称号が進化する'}</p></div>` : ''}
    <div class="panel"><h4>あなたの買い物</h4>${invHTML(player())}</div>
    <div class="row" style="display:flex;gap:10px"><button class="btn sub" id="toTitle" style="flex:1">タイトルへ</button><button class="btn" id="again" style="flex:1">再挑戦！</button></div>`;
  show('scr-result'); B = null;

}

function showResult() {
  if (!B) return;
  if (B.mode === 'boss') return showQueenResult();
  const mainsF = B.fs.filter(f => !f.minion);
  const ranking = [...mainsF.filter(f => f.alive), ...[...B.deaths].reverse()];
  const myRank = ranking.findIndex(f => f.isPlayer) + 1, N = ranking.length;
  const hadBoss = B.hadBoss;

  const p = player();

  SAVE.plays++;
  if (myRank === 1) SAVE.wins++;

  const tryUnlock = id => { if (unlock(id)) newly.push(CHARS.find(c => c.id === id)); };

  if (SAVE.wins >= 3) tryUnlock('tenbai');
  if (SAVE.wins >= 5) tryUnlock('madam');
  const next = CHARS.filter(c => c.hidden && !SAVE.unlocked[c.id] && c.winsNeed).map(c => `あと${c.winsNeed - SAVE.wins}回優勝で隠しキャラ解放`)[0] || '';
  $('#scr-result').innerHTML = `<div class="rank-hero"><div class="emo">${myRank === 1 ? '👑' : myRank === N ? '😵' : '🛍️'}</div><div class="r">${myRank}位</div><div style="font-weight:800">${msgs[myRank] || 'また明日の特売で…'}</div><div class="hint">累計優勝 ${SAVE.wins}回 ${next ? '／ ' + next : ''}</div></div>

    ${hadBoss && myRank !== 1 && !SAVE.unlocked.tencho ? '<div class="panel"><p class="hint" style="margin:0">🧑‍💼 本気の店長が乱入した試合で1位になると、何かが起こるらしい…</p></div>' : ''}
    <div class="rank-list">${ranking.map((f, i) => `<div class="rank-row ${f.isPlayer ? 'me' : ''}"><span class="no">${i + 1}位</span><span class="emo" style="font-size:24px">${f.emoji}</span><span style="flex:1">${f.isPlayer ? 'あなた（' + f.actor.char.name + '）' : f.name}</span><span style="font-size:12px;opacity:.7">買い物${f.actor.inv.count}個</span></div>`).join('')}</div>
    <div class="panel"><h4>あなたの買い物</h4>${invHTML(p)}</div>
    <div class="row" style="display:flex;gap:10px"><button class="btn sub" id="toTitle" style="flex:1">タイトルへ</button><button class="btn" id="again" style="flex:1">もう一度！</button></div>`;
  show('scr-result'); B = null;
  Snd.bgm('title');
  $('#again').onclick = () => { Snd.se('tap'); startShop(); };
  $('#toTitle').onclick = () => { Snd.se('tap'); renderTitle(); show('scr-title'); };
}

//  メインループ

let lastT = performance.now();
function loop(now) {
  let dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (G.screen === 'scr-shop' && S && !S.ended) {
    shopUpdate(dt * (G.pace || 1));
    S.renderT -= dt;
    if (S.renderT <= 0) { S.renderT = 0.1; renderShop(false); }
    renderBars();
  } else if (G.screen === 'scr-battle' && B) {
    const steps = $('#modal').hidden ? B.speed : 0; // 説明を開いている間は一時停止
    for (let i = 0; i < steps && B; i++) battleUpdate(dt);
    if (B) { drawBattle(dt * Math.max(1, steps)); updateBattleHUD(); }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { lastT = performance.now(); });
